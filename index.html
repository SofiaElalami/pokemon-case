<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Case - Evolution Checker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importiamo il font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Pokémon Case</h1>
        <p>Should I evolve this Pokémon?</p>
    </header>

    <main>
        <!-- Card di ricerca -->
        <div class="search-card">
            <h2>Check your Pokémon</h2>
            
            <form id="pokemonForm">
                <div class="input-group">
                    <label for="pokemonInput">Pokémon name</label>
                    <input type="text" id="pokemonInput" placeholder="e.g. Pikachu" required>
                </div>

                <div class="input-group">
                    <label for="candyInput">Candy available</label>
                    <input type="number" id="candyInput" placeholder="e.g. 50" min="0" required>
                </div>

                <button type="submit" id="checkBtn">Check Pokémon</button>
            </form>
            <div id="errorMsg" class="error"></div>
        </div>

        <!-- Card dei risultati (nascosta finché non si cerca un Pokémon) -->
        <div class="result-card" id="resultCard">
            <img id="pokemonImage" src="" alt="Pokemon">
            <h2 id="pokemonName"></h2>
            <p id="pokemonType"></p>
            
            <div class="evolution">
                <h3>Evolution Status</h3>
                <p id="evolutionDetails"></p>
            </div>
            
            <div id="recommendation">
                <h3 id="recommendationTitle"></h3>
                <p id="recommendationText"></p>
            </div>
        </div>
    </main>

    <!-- Assicurati che il nome del tuo file JavaScript sia questo -->
    <script src="script.js"></script>
</body>
</html>
